<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pez Gallo — Panel de Administración</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0A1628">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- ========== LOGIN PAGE ========== -->
  <div id="login-page">
    <div class="login-container glass-card">
      <img src="assets/logo.jpg" alt="Pez Gallo" class="login-logo">
      <h1 class="login-title">Panel de Administración</h1>
      <p class="login-subtitle">Pez Gallo</p>
      
      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="login-email" class="form-label">Email</label>
          <input type="email" id="login-email" class="form-input" placeholder="admin@pezgallo.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-password" class="form-label">Contraseña</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <p id="login-error" class="login-error" style="display:none;"></p>
        <button type="submit" class="btn btn-primary login-btn">Iniciar Sesión</button>
      </form>
      
      <a href="index.html" class="login-back-link">← Volver al menú</a>
    </div>
  </div>

  <!-- ========== DASHBOARD ========== -->
  <div id="dashboard" style="display:none;">
    
    <!-- Admin Header -->
    <header class="admin-header glass-card">
      <div class="admin-header__left">
        <img src="assets/logo.jpg" alt="Pez Gallo" class="admin-header__logo">
        <h1 class="admin-header__title">Panel Admin</h1>
      </div>
      <div class="admin-header__right">
        <a href="index.html" class="btn btn-secondary btn-sm" target="_blank">👁️ Ver Menú</a>
        <button id="btn-logout" class="btn btn-secondary btn-sm">Cerrar Sesión</button>
      </div>
    </header>

    <!-- Stats -->
    <div class="admin-content">
      <div class="stats-grid">
        <div class="stat-card glass-card">
          <span class="stat-number" id="stat-items">0</span>
          <span class="stat-label">Platillos</span>
        </div>
        <div class="stat-card glass-card">
          <span class="stat-number" id="stat-categories">0</span>
          <span class="stat-label">Categorías</span>
        </div>
        <div class="stat-card glass-card">
          <span class="stat-number" id="stat-available">0</span>
          <span class="stat-label">Disponibles</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="admin-actions">
        <button class="btn btn-primary" id="btn-add-category">+ Nueva Categoría</button>
        <button class="btn btn-primary" id="btn-add-item">+ Nuevo Platillo</button>
      </div>

      <!-- Menu List -->
      <div id="admin-menu-list">
        <div class="menu-loading">
          <div class="loading-spinner"></div>
          <p>Cargando datos...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== MODAL ========== -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal glass-card">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title">Agregar</h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="modal-form">
          <!-- Dynamic form content inserted by JS -->
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-cancel">Cancelar</button>
        <button class="btn btn-primary" id="modal-submit">Guardar</button>
      </div>
    </div>
  </div>

  <!-- ========== TOAST CONTAINER ========== -->
  <div id="toast-container" class="toast-container"></div>

  <!-- ========== SCRIPTS ========== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
